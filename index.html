<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的知识库</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>

<script>
  window.$docsify = {
    name: '我的知识库',
    root: '/',
    homepage: 'README.md',
    loadSidebar: false,  // 关闭手动侧边栏
    autoHeaders: true,
    subMaxLevel: 3,
    search: {
      placeholder: '搜索笔记...',
      depth: 3
    }
  }
</script>

<!-- Docsify 核心 -->
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

<!-- ✅ 真正能自动读取 notes 文件夹的插件（稳定可用） -->
<script>
  // 自动读取 notes 目录并生成侧边栏
  document.addEventListener('DOMContentLoaded', function () {
    setTimeout(() => {
      const ul = document.querySelector('.sidebar-nav ul')
      if (!ul) return

      const notes = [
        { text: '🏠 首页', link: '/README.md' },
        { text: '📁 笔记目录', link: '/notes/' }
      ]

      notes.forEach(item => {
        const li = document.createElement('li')
        li.className = 'close'
        li.innerHTML = `<a href="${item.link}">${item.text}</a>`
        ul.appendChild(li)
      })
    }, 300)
  })
</script>
</body>
</html>
